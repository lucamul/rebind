<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rebind</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #383838;
      flex-shrink: 0;
    }
    h1 {
      font-weight: 300;
      letter-spacing: 0.05em;
      font-size: 1.1rem;
      margin: 0;
    }
    button {
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2c2c2c;
      color: #e8e8e8;
      cursor: pointer;
    }
    button:hover {
      background: #3a3a3a;
    }
    #path {
      color: #9a9a9a;
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      color: #e8a95c;
      font-size: 0.85rem;
      padding: 0 1rem;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem 4rem;
    }
    .page {
      max-width: 640px;
      margin: 0 auto 2.5rem;
    }
    .page-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6a6a6a;
      border-bottom: 1px solid #333;
      padding-bottom: 0.3rem;
      margin-bottom: 1rem;
    }
    .paragraph {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 0.9rem;
      white-space: pre-wrap;
    }
    .paragraph.italic {
      font-style: italic;
    }
    .paragraph.bold {
      font-weight: 600;
    }
    .empty-page {
      color: #555;
      font-size: 0.85rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>Rebind</h1>
    <button id="open">Open PDF…</button>
    <div id="path"></div>
  </header>
  <div id="status"></div>
  <main id="pages"></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
