<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rebind</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    main {
      text-align: center;
      width: 90%;
      max-width: 480px;
    }
    h1 {
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    #path {
      color: #9a9a9a;
      font-size: 0.85rem;
      min-height: 1.2em;
      word-break: break-all;
    }
    button {
      margin-top: 0.8rem;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2c2c2c;
      color: #e8e8e8;
      cursor: pointer;
    }
    button:hover {
      background: #3a3a3a;
    }
    #status {
      margin-top: 1rem;
      color: #9a9a9a;
      min-height: 1.2em;
      text-align: left;
      white-space: pre-wrap;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Rebind</h1>
    <button id="open">Open PDF…</button>
    <div id="path"></div>
    <div id="status"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
